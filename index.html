<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>IdleAngels 模型查看器</title>

    <!--
      Wallpaper Engine audio listener, registered by inline classic script.

      It lives here, before Vite's module script, so registration happens during
      HTML parsing rather than after the deferred module runs. The handler only
      stores the latest frame on window; the React app reads it through
      src/wallpaperAudio.js.

      `general.supportsaudioprocessing` in project.json must stay nested under
      "general" - see AGENTS.md.
    -->
    <script>
      window.__weAudioFrame = null;
      window.__weAudioAt = 0;

      if (typeof window.wallpaperRegisterAudioListener === 'function') {
        window.wallpaperRegisterAudioListener(function (audioArray) {
          if (!audioArray || typeof audioArray.length !== 'number' || audioArray.length < 128) {
            return;
          }
          // Copy once so the engine can reuse its own buffer.
          window.__weAudioFrame = Float32Array.from(audioArray);
          window.__weAudioAt = Date.now();
        });
      }
    </script>

    <!--
      Wallpaper Engine media integration: album art and track metadata.

      Registered inline for the same reason as the audio listener. Every field is
      written onto one global object; src/wallpaperMedia.js only reads it.
    -->
    <script>
      window.__weMedia = {
        thumbnail: '',
        title: '',
        artist: '',
        albumTitle: '',
        primaryColor: '',
        textColor: '',
        playback: null,
        enabled: null,
        updatedAt: 0,
      };

      var media = window.__weMedia;

      if (typeof window.wallpaperRegisterMediaStatusListener === 'function') {
        window.wallpaperRegisterMediaStatusListener(function (event) {
          media.enabled = event ? event.enabled === true : null;
        });
      }

      if (typeof window.wallpaperRegisterMediaThumbnailListener === 'function') {
        window.wallpaperRegisterMediaThumbnailListener(function (event) {
          if (!event) return;
          media.thumbnail = event.thumbnail || '';
          media.primaryColor = event.primaryColor || '';
          media.textColor = event.textColor || '';
          media.updatedAt = Date.now();
        });
      }

      if (typeof window.wallpaperRegisterMediaPropertiesListener === 'function') {
        window.wallpaperRegisterMediaPropertiesListener(function (event) {
          if (!event) return;
          media.title = event.title || '';
          media.artist = event.artist || '';
          media.albumTitle = event.albumTitle || '';
          media.updatedAt = Date.now();
        });
      }

      if (typeof window.wallpaperRegisterMediaPlaybackListener === 'function') {
        window.wallpaperRegisterMediaPlaybackListener(function (event) {
          if (!event) return;
          var constants = window.wallpaperMediaIntegration;
          // The playback integers are host-defined, so they must never be
          // hard-coded. If the constants object is missing entirely we cannot
          // classify the state: keep `null` (meaning "unknown") instead of
          // guessing "stopped", which would hide the album art for good.
          if (!constants) {
            media.playback = null;
            return;
          }
          if (event.state === constants.PLAYBACK_PLAYING) media.playback = 'playing';
          else if (event.state === constants.PLAYBACK_PAUSED) media.playback = 'paused';
          else media.playback = 'stopped';
        });
      }
    </script>

    <!--
      Pause bridge.

      The engine freezes its render process while paused, but the page keeps its
      own requestAnimationFrame loops and timers alive, which wastes power on a
      wallpaper that runs for hours. The flag is recorded here and broadcast as a
      DOM event so src/wallpaperPause.js can react after the module loads.
    -->
    <script>
      window.__wePaused = false;

      function __weSetPaused(value) {
        var next = value === true;
        if (window.__wePaused === next) return;
        window.__wePaused = next;
        window.dispatchEvent(
          new CustomEvent('we-pause-change', { detail: next }),
        );
      }

      // Only attach to a listener object the engine itself created. Creating one
      // unconditionally would make the app's `wallpaperPropertyListener` based
      // environment check pass in a plain browser, hiding the model picker and
      // collapsing the drawer everywhere.
      if (window.wallpaperPropertyListener) {
        window.wallpaperPropertyListener.setPaused = __weSetPaused;
      } else if (typeof window.wallpaperRegisterAudioListener === 'function') {
        // Engine present but it has not created the listener object yet: create
        // it so the pause callback is not lost.
        window.wallpaperPropertyListener = { setPaused: __weSetPaused };
      }
    </script>
  </head>
